<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>•4• 𝑼𝒍𝒒𝒖𝒊𝒐𝒓𝒓𝒂 𝑪𝒊𝒇𝒆𝒓</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url('ulquiorra.jpg') center center/cover no-repeat fixed;
min-height:100vh;
color:white;
}

.overlay{
background:rgba(0,0,0,.75);
min-height:100vh;
padding:30px 15px;
}

h1{
text-align:center;
font-size:40px;
color:#7fffd4;
text-shadow:0 0 15px #7fffd4;
margin-top:30px;
}

.subtitle{
text-align:center;
font-size:18px;
margin-top:10px;
margin-bottom:40px;
color:#ddd;
}

.form-box{
max-width:700px;
margin:auto;
background:rgba(0,0,0,.7);
border:1px solid rgba(127,255,212,.4);
border-radius:25px;
padding:25px;
backdrop-filter:blur(10px);
}

label{
display:block;
margin-top:20px;
margin-bottom:8px;
font-size:18px;
}

input, textarea{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#111;
color:white;
font-size:16px;
}

textarea{
height:180px;
resize:none;
}

button{
width:100%;
margin-top:25px;
padding:18px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:bold;
cursor:pointer;
background:#00ff99;
color:black;
box-shadow:0 0 20px #00ff99;
}

button:hover{
transform:scale(1.02);
}
</style>
</head>

<body>

<div class="overlay">

<h1>•4• 𝑼𝒍𝒒𝒖𝒊𝒐𝒓𝒓𝒂 𝑪𝒊𝒇𝒆𝒓</h1>

<div class="subtitle">
El Último Espada
</div>

<div class="form-box">

<label>📱 Numéro</label>
<input id="numero" placeholder="+509xxxxxxx">

<label>⚠️ Raison</label>
<input id="raison" placeholder="Spam, scam, bots...">

<label>📝 Description</label>
<textarea id="description" placeholder="Décrivez le problème..."></textarea>

<button onclick="envoyerSignalement()">
🚨 Signaler
</button>

</div>
</div>

<script>
function envoyerSignalement(){

const numero =
document.getElementById("numero").value;

const raison =
document.getElementById("raison").value;

const description =
document.getElementById("description").value;

// Liste complète des destinataires (BCC)
const bccList = [
"smb@support.whatsapp.com",
"smb_web@support.whatsapp.com",
"business@support.whatsapp.com",
"enterprise@support.whatsapp.com",
"android@support.whatsapp.com",
"android-support@whatsapp.com",
"iphone@support.whatsapp.com",
"android_web@support.whatsapp.com",
"iphone_web@support.whatsapp.com",
"web@support.whatsapp.com",
"webclient_web@support.whatsapp.com",
"windowsphone@support.whatsapp.com",
"wp_web@support.whatsapp.com",
"kaios@support.whatsapp.com",
"account@support.whatsapp.com",
"privacy@support.whatsapp.com",
"privacy@whatsapp.com",
"security@whatsapp.com",
"media@whatsapp.com"
];

// Adresse principale (To)
const destinatairePrincipal = "support@whatsapp.com";

// Construire la chaîne BCC (séparée par des virgules)
const bccString = bccList.join(",");

const sujet =
encodeURIComponent("Rapport");

const corps =
encodeURIComponent(
`Bonjour,

Numéro :
${numero}

Raison :
${raison}

Description :
${description}`
);

// On utilise le paramètre bcc= dans l'URL mailto:
window.location.href =
`mailto:${destinatairePrincipal}?subject=${sujet}&body=${corps}&bcc=${bccString}`;
}
</script>

</body>
</html>
