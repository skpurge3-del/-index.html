<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>•4• 𝑼𝒍𝒒𝒊𝒐𝒓𝒓𝒂 𝑪𝒊𝒇𝒆𝒓</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100%;
height:100vh;
background:url('ulquiorra.jpg') center center/cover no-repeat;
overflow:hidden;
color:white;
}

.titre{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:38px;
font-weight:bold;
text-align:center;
color:#7fffd4;
text-shadow:0 0 20px #7fffd4;
width:100%;
}

.soustitre{
position:absolute;
top:95px;
left:50%;
transform:translateX(-50%);
font-size:18px;
color:white;
}

.signaler{
position:absolute;
bottom:60px;
left:50%;
transform:translateX(-50%);
padding:18px 45px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:bold;
cursor:pointer;
background:#00ff99;
color:black;
box-shadow:0 0 20px #00ff99;
transition:.3s;
}

.signaler:hover{
transform:translateX(-50%) scale(1.05);
}

</style>
</head>

<body>

<div class="titre">
•4• 𝑼𝒍𝒒𝒊𝒐𝒓𝒓𝒂 𝑪𝒊𝒇𝒆𝒓
</div>

<div class="soustitre">
El Último Espada
</div>

<button class="signaler" onclick="ouvrirSupport()">
🚨 Signaler
</button>

<script>

function ouvrirSupport(){

const sujet =
encodeURIComponent("Signalement WhatsApp");

const message =
encodeURIComponent(
`Bonjour WhatsApp Support,

Je souhaite signaler un compte pour activité suspecte.

Merci de vérifier ce signalement.

Cordialement.`
);

window.location.href =
`mailto:support@support.whatsapp.com,service@support.whatsapp.com,contact@whatsapp.com,security@whatsapp.com,iphone_web@support.whatsapp.com?subject=${sujet}&body=${message}`;


}

</script>

</body>
</html>
