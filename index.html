<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>•4• 𝑼𝒍𝒒𝒊𝒐𝒓𝒓𝒂 𝑪𝒊𝒇𝒆𝒓</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100%;
height:100vh;
background:url('ulquiorra.jpg') center center/cover no-repeat;
overflow:hidden;
color:white;
}

.titre{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:38px;
font-weight:bold;
text-align:center;
color:#7fffd4;
text-shadow:0 0 20px #7fffd4;
width:100%;
}

.soustitre{
position:absolute;
top:95px;
left:50%;
transform:translateX(-50%);
font-size:18px;
color:white;
}

/* Style du conteneur de message */
.message-container {
position: absolute;
bottom: 200px;
left: 50%;
transform: translateX(-50%);
width: 85%;
max-width: 600px;
text-align: center;
}

.message-input {
width: 100%;
padding: 12px;
border-radius: 10px;
border: 2px solid #00ff99;
background: rgba(0,0,0,0.85);
color: white;
font-size: 14px;
resize: vertical;
font-family: Arial, sans-serif;
line-height: 1.5;
}

.message-input:focus {
outline: none;
border-color: #7fffd4;
box-shadow: 0 0 15px #00ff99;
}

/* Style des boutons */
.boutons-container {
position: absolute;
bottom: 60px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 20px;
}

.btn-off {
padding: 15px 40px;
border: none;
border-radius: 20px;
font-size: 20px;
font-weight: bold;
cursor: pointer;
background: #ff3366;
color: white;
box-shadow: 0 0 20px #ff3366;
transition: .3s;
}

.btn-off:hover {
transform: scale(1.05);
background: #ff0066;
}

.btn-signaler {
padding: 15px 40px;
border: none;
border-radius: 20px;
font-size: 20px;
font-weight: bold;
cursor: pointer;
background: #00ff99;
color: black;
box-shadow: 0 0 20px #00ff99;
transition: .3s;
}

.btn-signaler:hover {
transform: scale(1.05);
}

</style>
</head>

<body>

<div class="titre">
•4• 𝑼𝒍𝒒𝒊𝒐𝒓𝒓𝒂 𝑪𝒊𝒇𝒆𝒓
</div>

<div class="soustitre">
El Último Espada
</div>

<!-- Zone de message -->
<div class="message-container">
<textarea id="messageArea" class="message-input" rows="5" placeholder="Appuyez sur OFF pour remplir le message..."></textarea>
</div>

<!-- Boutons -->
<div class="boutons-container">
<button class="btn-off" onclick="remplirMessage()">
🔴 OFF
</button>

<button class="btn-signaler" onclick="envoyerEmail()">
🚨 Signaler
</button>
</div>

<script>

// Fonction pour remplir la barre de message
function remplirMessage() {
const messageTextarea = document.getElementById('messageArea');
messageTextarea.value = `Bonjour WhatsApp Support,

Je souhaite signaler un numéro suspect sur WhatsApp pour non-respect des conditions d'utilisation.

Raison : Spam et activité suspecte

Merci de vérifier ce signalement.

Cordialement.`;
}

// Fonction pour envoyer le contenu du message par email
function envoyerEmail() {
const messageTextarea = document.getElementById('messageArea');
let messageContent = messageTextarea.value;

// Vérifier si le message est vide
if (!messageContent.trim()) {
alert("Veuillez d'abord appuyer sur le bouton OFF pour remplir le message.");
return;
}

const sujet = encodeURIComponent("Signalement WhatsApp");
const corps = encodeURIComponent(messageContent);

// Ouvrir le client email par défaut
window.location.href = `mailto:support@whatsapp.com?subject=${sujet}&body=${corps}`;
}

</script>

</body>
</html>
